pipeline:
  projectIdentifier: datarobotusermodels
  orgIdentifier: Custom_Models
  tags: {}
  stages:
    - stage:
        name: Build list of envs to test
        identifier: build_list_of_envs_to_test
        description: ""
        type: CI
        spec:
          cloneCodebase: false
          execution:
            steps:
              - step:
                  type: GitClone
                  name: Clone repo
                  identifier: Clone_repo
                  spec:
                    connectorRef: account.svc_harness_git1
                    repoName: <+pipeline.variables.target_repo>
                    cloneDirectory: /harness/<+pipeline.variables.target_repo>
                    build:
                      type: branch
                      spec:
                        branch: <+pipeline.variables.source_branch>
                  description: Explicitly clone repo to pull a commit created during reconciliation
              - step:
                  type: Run
                  name: build_list_of_environments_to_test_on
                  identifier: build_list_of_environments_to_test_on
                  spec:
                    connectorRef: account.dockerhub_datarobot_read
                    shell: Sh
                    command: |-
                      cd /harness/<+pipeline.variables.target_repo>
                      echo "Show last 2 git commits: "
                      git log -2

                      # Skip the per-framework test matrix when the diff is confined to the
                      # notebook EE (CFX-8186) - independent of the Reconcile stage's
                      # CHANGED_DIRS, which also gates the deployment-relevant image build
                      # above and must keep running unconditionally for that.
                      # A git failure here must fail this step loudly rather than silently
                      # defaulting to "skip" - see PR #2397 review.
                      git fetch origin <+pipeline.variables.target_branch> || { echo "git fetch failed"; exit 1; }
                      changed_files=$(git diff --name-only origin/<+pipeline.variables.target_branch>...HEAD) || { echo "git diff failed"; exit 1; }
                      should_run_framework_tests=true
                      if [ -n "${changed_files}" ] && ! echo "${changed_files}" | grep -qvE "^public_dropin_notebook_environments/"; then
                        should_run_framework_tests=false
                      fi
                      echo "should_run_framework_tests: ${should_run_framework_tests}"

                      matrix_values=$(python3 ./harness_scripts/functional_by_framework_multistep/generate_testlist.py ./tests/functional/test_per_framework.json ./)
                      echo ${matrix_values}
                    outputVariables:
                      - name: matrix_values
                      - name: should_run_framework_tests
          caching:
            enabled: false
            paths: []
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          buildIntelligence:
            enabled: false
        when:
          pipelineStatus: Success
    - stage:
        name: Test func by framework in container
        identifier: test_by_framework_in_container
        description: ""
        type: CI
        spec:
          cloneCodebase: false
          execution:
            steps:
              - step:
                  type: Run
                  name: Run functional test in provided framework
                  identifier: Run_1
                  spec:
                    connectorRef: datarobot_user_models_read_write
                    image: datarobotdev/genai-ci-tools:latest-docker
                    shell: Bash
                    command: |-
                      export GH_TOKEN='<+secrets.getValue("account.Github_Access_Token")>'
                      export DH_USER='<+secrets.getValue("org.genai-systems-dockerhub-login")>'
                      export DH_TOKEN='<+secrets.getValue("org.genai-systems-dockerhub-token")>'
                      REPO='<+pipeline.variables.target_repo>'
                      SOURCE_REF='<+pipeline.variables.source_branch>'
                      ENVDIR='<+matrix.env.env_folder>/<+matrix.env.framework>'
                      set -x

                      # Clone ourselves because harness clones strip creds and forcibly shallow clone
                      # and we end up doing more work to fix it
                      git clone "https://${GH_TOKEN}@github.com/datarobot/${REPO}.git"
                      cd "${REPO}"
                      git checkout "${SOURCE_REF}"

                      # Simple wrapper around reporting status back to GitHub
                      ghstatus.send() {
                        local state="${1:?GitHub status state is required (pending, success, failure, error)}"
                        local desc="${2:?Description is required}"
                        /usr/local/bin/github.status.sh json "${state}" \
                          "$(/usr/local/bin/harness.execution-url.sh)" \
                          "${desc}" \
                          "Test framework - <+matrix.env.env_folder> - <+matrix.env.repo>:<+matrix.env.tag>" \
                          | /usr/local/bin/github.status.sh setfromhead
                      }

                      # Report back to the PR the status check state
                      notify_exit() {
                        local retval="${?}"
                        local state='success'
                        if [ "${retval}" -gt 0 ]; then
                          state='failure'
                        fi
                        ghstatus.send "${state}" "Test ${state}"
                      }

                      trap notify_exit EXIT # Call notify_exit when the step finishes

                      # Run tests
                      ghstatus.send pending "Test is running"
                      cd /harness/<+pipeline.variables.target_repo>

                      img="docker.io/datarobotdev/<+matrix.env.repo>:<+matrix.env.tag>"

                      # Wait for the image to show up because build is an async process
                      docker login -u "${DH_USER}" --password-stdin <<<"${DH_TOKEN}"
                      export MAXWAIT=1800 # 30 minutes because r-lang builds really slow
                      /usr/local/bin/docker.wait-for-tag.sh "${img}" || exit $?

                      # Run test on the image
                      docker run -i --network=host \
                        --volume "$(pwd):/harness" --workdir /harness \
                        --entrypoint /bin/sh "${img}" -c \
                        'harness_scripts/functional_by_framework/check_by_framework_run1_step_entrypoint.sh \
                          <+matrix.env.framework> <+matrix.env.env_folder>'
                    resources:
                      limits:
                        memory: 3G
                contextType: Pipeline
          caching:
            enabled: false
            paths: []
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          buildIntelligence:
            enabled: false
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.build_list_of_envs_to_test.spec.execution.steps.build_list_of_environments_to_test_on.output.outputVariables.should_run_framework_tests> == "true"
        strategy:
          matrix:
            env: <+json.list("environments", <+pipeline.stages.build_list_of_envs_to_test.spec.execution.steps.build_list_of_environments_to_test_on.output.outputVariables.matrix_values>)>
            nodeName: <+matrix.env.env_folder>/<+matrix.env.framework> - <+matrix.env.tag>
  identifier: Test_functional_by_framework_multisteps
  description: |-
    Runs functional tests for each framework in a corresponding image.
    If only DRUM changed in the PR, latest image is taken for every framework, DRUM installed and tests run.
    If environment itself has changed, temporary image is built.
  name: Test functional by framework - multisteps
  variables:
    - name: target_repo
      type: String
      description: ""
      required: true
      value: <+input>
    - name: target_branch
      type: String
      description: Target branch (master, release/10.2)
      required: false
      value: <+input>
    - name: source_branch
      type: String
      description: ""
      required: false
      value: <+input>
    - name: envs_parent_folders_to_include
      type: String
      description: |-
        Comma separated list of envs parent folders to update; all if empty.
        E.g. if changes are in: parent1/env1, parent2/env2; and parent2 is provided, only parent2/env2 is included
      required: false
      value: <+input>
    - name: force_requirements_upgrade
      type: String
      description: Whether to force all requirements update to the latest versions
      required: false
      value: <+input>.default(false).allowedValues(true,false)
  properties:
    ci:
      codebase:
        connectorRef: account.svc_harness_git1
        repoName: <+pipeline.variables.target_repo>
        build:
          type: branch
          spec:
            branch: <+pipeline.variables.source_branch>
