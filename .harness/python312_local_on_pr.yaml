trigger:
  name: python312 local on pr
  identifier: python312_local_on_pr
  enabled: true
  stagesToExecute: []
  description: ""
  tags: {}
  encryptedWebhookSecretIdentifier: ""
  orgIdentifier: Custom_Models
  projectIdentifier: datarobotusermodels
  pipelineIdentifier: test_functional_by_framework
  source:
    type: Webhook
    spec:
      type: Github
      spec:
        type: PullRequest
        spec:
          connectorRef: account.svc_harness_git1
          autoAbortPreviousExecutions: false
          payloadConditions:
            - key: targetBranch
              operator: Equals
              value: master
            - key: changedFiles
              operator: Regex
              value: ^(custom_model_runner/|public_dropin_environments/python312/|tests/|harness_scripts/functional_by_framework/|model_templates/|requirements_for_per_framework_tests\.txt).*
          headerConditions: []
          repoName: datarobot-user-models
          actions:
            - Open
            - Reopen
            - Synchronize
  pipelineBranchName: <+trigger.branch>
  inputSetRefs:
    - python312_local_default_pr_input
