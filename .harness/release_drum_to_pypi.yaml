pipeline:
  projectIdentifier: datarobotusermodels
  orgIdentifier: Custom_Models
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: account.svc_harness_git1
        repoName: datarobot-user-models
        build: <+input>
  stages:
    - stage:
        name: Build DRUM and publish to Pypi
        identifier: Build_DRUM
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          execution:
            steps:
              - step:
                  type: Run
                  name: Build DRUM and publish to Pypi
                  identifier: build_drum_and_publish_to_pypi
                  spec:
                    connectorRef: datarobot_user_models_read_write
                    image: datarobotdev/drum-builder:ubuntu-24-04
                    shell: Bash
                    command: |-
                      . ${VIRTUAL_ENV}/bin/activate
                      ./harness_scripts/drum_release/release_drum.sh "<+pipeline.variables.release_type>"
                    envVariables:
                      DRY_RUN: <+pipeline.variables.dry_run>
                      TWINE_USERNAME: <+secrets.getValue("datarobot_drum_pypi_username")>
                      TWINE_PASSWORD: <+secrets.getValue("datarobot_drum_pypi_password")>
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          caching:
            enabled: false
            paths: []
          buildIntelligence:
            enabled: false
  identifier: release_drum_to_pypi
  name: Release DRUM to Pypi
  description: |-
    Pipeline to release DRUM to https://pypi.org/project/datarobot-drum/
    release_type=main publishes the version from description.py as is.
    release_type=dev publishes <version>.devN, where N is the next free dev number on PyPI.
    dry_run=true builds and validates the wheel but does not upload it.
  variables:
    - name: release_type
      type: String
      description: "main - release version as is; dev - release <version>.devN"
      required: true
      value: <+input>.default(main).allowedValues(main,dev)
    - name: dry_run
      type: String
      description: "true - build and validate the wheel without uploading it to PyPI"
      required: true
      value: <+input>.default(false).allowedValues(false,true)
