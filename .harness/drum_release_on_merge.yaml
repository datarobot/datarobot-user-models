pipeline:
  name: Release DRUM on merge
  identifier: drum_release_on_merge
  projectIdentifier: datarobotusermodels
  orgIdentifier: Custom_Models
  description: |-
    Started by the drum_release_on_push_master trigger when description.py changes on master.
    If the DRUM version was bumped and is not on PyPI yet, asks for approval to release
    a dev build (<version>.devN) and then the main version, via release_drum_to_pypi.
    Rejecting or not answering an approval aborts the remaining releases.
  tags: {}
  properties:
    ci:
      codebase:
        connectorRef: account.svc_harness_git1
        repoName: datarobot-user-models
        build: <+input>
  variables:
    - name: before_sha
      type: String
      description: Previous master head of the push; empty for manual runs, then only PyPI is checked.
      required: false
      value: <+input>.default()
  stages:
    - stage:
        name: Detect DRUM version bump
        identifier: detect
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          execution:
            steps:
              - step:
                  type: Run
                  name: Detect version bump
                  identifier: detect_version
                  spec:
                    connectorRef: datarobot_user_models_read_write
                    image: datarobotdev/drum-builder:ubuntu-24-04
                    shell: Bash
                    command: |-
                      source ./harness_scripts/drum_release/detect_version_bump.sh "<+pipeline.variables.before_sha>"
                      COMMIT_SHA="$(git rev-parse HEAD)"
                    outputVariables:
                      - name: VERSION_BUMPED
                      - name: DRUM_VERSION
                      - name: COMMIT_SHA
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          caching:
            enabled: false
            paths: []
          buildIntelligence:
            enabled: false
    - stage:
        name: Approve dev release
        identifier: approve_dev_release
        description: ""
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Approve dev release
                  identifier: approve_dev_release
                  timeout: 7d
                  spec:
                    approvalMessage: |-
                      Release DRUM <+pipeline.stages.detect.spec.execution.steps.detect_version.output.outputVariables.DRUM_VERSION> as a dev build (<version>.devN) to PyPI?
                      Reject to skip both dev and main releases.
                    includePipelineExecutionHistory: true
                    isAutoRejectEnabled: false
                    approvers:
                      userGroups:
                        - drum_release_approvers
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    approverInputs: []
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.detect.spec.execution.steps.detect_version.output.outputVariables.VERSION_BUMPED> == "true"
        failureStrategies:
          - onFailure:
              errors:
                - ApprovalRejection
                - Timeout
              action:
                type: Abort
    - stage:
        name: Release dev
        identifier: release_dev
        description: ""
        type: Pipeline
        spec:
          org: Custom_Models
          project: datarobotusermodels
          pipeline: release_drum_to_pypi
          inputs:
            identifier: release_drum_to_pypi
            properties:
              ci:
                codebase:
                  build:
                    type: commitSha
                    spec:
                      commitSha: <+pipeline.stages.detect.spec.execution.steps.detect_version.output.outputVariables.COMMIT_SHA>
            variables:
              - name: release_type
                type: String
                value: dev
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.detect.spec.execution.steps.detect_version.output.outputVariables.VERSION_BUMPED> == "true"
    - stage:
        name: Approve main release
        identifier: approve_main_release
        description: ""
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Approve main release
                  identifier: approve_main_release
                  timeout: 7d
                  spec:
                    approvalMessage: |-
                      Release DRUM <+pipeline.stages.detect.spec.execution.steps.detect_version.output.outputVariables.DRUM_VERSION> to PyPI as the main version?
                    includePipelineExecutionHistory: true
                    isAutoRejectEnabled: false
                    approvers:
                      userGroups:
                        - drum_release_approvers
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    approverInputs: []
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.detect.spec.execution.steps.detect_version.output.outputVariables.VERSION_BUMPED> == "true"
        failureStrategies:
          - onFailure:
              errors:
                - ApprovalRejection
                - Timeout
              action:
                type: Abort
    - stage:
        name: Release main
        identifier: release_main
        description: ""
        type: Pipeline
        spec:
          org: Custom_Models
          project: datarobotusermodels
          pipeline: release_drum_to_pypi
          inputs:
            identifier: release_drum_to_pypi
            properties:
              ci:
                codebase:
                  build:
                    type: commitSha
                    spec:
                      commitSha: <+pipeline.stages.detect.spec.execution.steps.detect_version.output.outputVariables.COMMIT_SHA>
            variables:
              - name: release_type
                type: String
                value: main
        when:
          pipelineStatus: Success
          condition: <+pipeline.stages.detect.spec.execution.steps.detect_version.output.outputVariables.VERSION_BUMPED> == "true"
