pipeline:
  name: Retag and Push Docker Image
  identifier: retag_push_docker_image
  projectIdentifier: datarobotusermodels
  orgIdentifier: Custom_Models
  tags: {}
  stages:
    - stage:
        name: Retag Docker Image
        identifier: Retag_Docker_Image
        description: ""
        type: CI
        spec:
          cloneCodebase: true
          caching:
            enabled: true
            override: false
            paths: []
          buildIntelligence:
            enabled: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Retag and Push Image
                  identifier: Retag_and_Push_Image
                  spec:
                    shell: Bash
                    command: |-
                      set -euo pipefail

                      # Set source and target image tags
                      echo "Starting script"
                      docker login -u <+secrets.getValue("org.genai-systems-dockerhub-login")> -p <+secrets.getValue("org.genai-systems-dockerhub-token")>

                      # Harness clones shallow, so HEAD~1 can sit outside the fetched history. Deepen once,
                      # then fail loudly: an unchecked `git diff` that errors returns empty, which reads as
                      # "no environments changed" and exits 0 having promoted nothing.
                      if [ -f "$(git rev-parse --git-dir)/shallow" ]; then
                        git fetch -q --deepen=1 >/dev/null 2>&1 || true
                      fi
                      changed_files=$(git diff --name-only HEAD~1 HEAD) || { echo 'git diff HEAD~1 HEAD failed' >&2; exit 1; }
                      env_files=$(echo "$changed_files" | grep 'env_info\.json' || true)

                      if [ -n "$env_files" ]; then
                        echo "Found changed env_info.json files:"
                        echo ${env_files}
                        for file in $env_files; do
                          if [ -f "$file" ]; then
                            echo "Processing: $file"

                            REPO=$(jq -r ".imageRepository" $file)
                            ENV_VER_ID=$(jq -r ".environmentVersionId" $file)
                            SOURCE_IMAGE="datarobotdev/${REPO}:${ENV_VER_ID}"
                            TARGET_IMAGE="datarobot/${REPO}:${ENV_VER_ID}"
                          
                            echo "Pulling source image: $SOURCE_IMAGE"
                            docker pull "$SOURCE_IMAGE"

                            echo "Retagging to: $TARGET_IMAGE"
                            docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"

                            echo "Pushing target image..."
                            docker push "$TARGET_IMAGE"
                          else
                            echo "File not found: $file"
                          fi
                        done
                        PROMOTED="$(printf '%s' "$env_files" | tr '\n' ' ')"
                      else
                        echo "No env_info.json files changed in the last commit."
                        PROMOTED=""
                      fi
                    outputVariables:
                      # Handed to the installer bump below, so it does not ask git the same question twice.
                      - name: PROMOTED
                        type: String
                        value: PROMOTED
              - step:
                  type: Run
                  name: Execution Environments Installer PR
                  identifier: execution_environments_PR
                  spec:
                    connectorRef: account.dockerhub_datarobot_read
                    image: datarobotdev/genai-ci-tools:latest
                    shell: Bash
                    command: |-
                      #!/usr/bin/env bash
                      set -euo pipefail
                      set -x

                      # Promoting the images is only half of shipping a fix. EE Helm rebuilds the
                      # execution-environments chart and opens the datarobot-app-charts bump, but it only runs on a
                      # push to execution-environment-installer, which a merge here never touches. Bumping this
                      # manifest connects the two, exactly as the global-envs-models pipeline does for its own.
                      export GH_TOKEN="<+secrets.getValue("account.githubpatsvcharnessgit2")>"
                      PROMOTED="<+execution.steps.Retag_and_Push_Image.output.outputVariables.PROMOTED>"
                      EXECUTION_URL="<+pipeline.execution.url>"

                      # Nothing promoted, nothing for EE Helm to rebuild. Guarded here rather than in a
                      # when-condition: an output variable that did not resolve is not reliably comparable
                      # in JEXL, and this reads the same either way.
                      if [ -z "${PROMOTED//[[:space:]]/}" ]; then
                        echo 'No images promoted; not bumping the installer manifest.'
                        exit 0
                      fi

                      # Harness resolves this for every branch build, webhook or manual, and it stays
                      # correct even if the clone leaves HEAD detached. git is only the fallback.
                      TARGET_BRANCH="<+codebase.branch>"
                      # An expression Harness could not resolve arrives as its own literal text; treat that
                      # as unset rather than cloning a branch named "<+codebase.branch>".
                      case "$TARGET_BRANCH" in '<+'*) TARGET_BRANCH='' ;; esac
                      if [ -z "${TARGET_BRANCH//[[:space:]]/}" ]; then
                        TARGET_BRANCH="$(git branch --show-current || true)"
                      fi

                      # Collected in this checkout: these stop resolving once we cd into the installer clone. All
                      # best-effort, so a failure costs a line of the body and never the PR; grep exits 1 on no
                      # match, hence every || true.
                      COMMIT_SHA="$(git rev-parse HEAD 2>/dev/null || true)"
                      COMMIT_SUBJECT="$(git log -1 --format=%s 2>/dev/null || true)"
                      NOTES="$(git log -1 --format='%s%n%b' 2>/dev/null || true)"
                      # CVE- excluded so a CVE id is not read as a ticket key.
                      TICKETS="$(printf '%s' "$NOTES" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | grep -v '^CVE-' | sort -u | tr '\n' ' ' || true)"
                      CVES="$(printf '%s' "$NOTES" | grep -oE 'CVE-[0-9]{4}-[0-9]+' | sort -u | tr '\n' ' ' || true)"

                      # No silent default. A tag or SHA run has no branch to speak of, and guessing would
                      # bump master's RELEASE from a run that was never about master.
                      if [ -z "${TARGET_BRANCH//[[:space:]]/}" ]; then
                        echo "FATAL: TARGET_BRANCH is empty, probably a tag or SHA run. Re-run against a branch;" >&2
                        echo "refusing to guess the installer branch, because guessing wrong edits master." >&2
                        exit 1
                      fi
                      if [[ "$TARGET_BRANCH" =~ ^release/ ]]; then
                        INSTALLER_BRANCH="$TARGET_BRANCH"
                      else
                        INSTALLER_BRANCH="master"
                      fi
                      echo "Using execution-environment-installer branch: $INSTALLER_BRANCH"

                      # Any bump already open on this branch is superseded by the one below: RELEASE is a plain
                      # counter and REF floats to HEAD, so an older unmerged bump carries an identical diff. Listed
                      # now, closed only once the new one exists, so there is never a moment with none open.
                      # Filtered client-side rather than with --search, whose index lags a just-created PR.
                      BUMP_TITLE="datarobot-user-models Execution Environments release bump"
                      STALE_PRS="$(gh pr list --repo datarobot/execution-environment-installer --state open \
                        --base "$INSTALLER_BRANCH" --limit 200 --json number,title \
                        --jq "[.[] | select(.title | contains(\"$BUMP_TITLE\"))] | .[].number" 2>/dev/null | tr '\n' ' ' || true)"

                      # Pass the token with a credential helper, not in the clone URL. Newer git drops URL
                      # credentials after it follows a redirect, so the push inside github.create-pr.sh goes
                      # out without auth and fails. Same pattern as pdie_update_and_rebuild_all.
                      git config --global credential.https://github.com.helper \
                        '!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
                      git clone --branch "$INSTALLER_BRANCH" https://github.com/datarobot/execution-environment-installer.git /tmp/execution-environment-installer
                      cd /tmp/execution-environment-installer/manifests

                      CURRENT_RELEASE=$(grep "^RELEASE=" datarobot-user-models.conf | cut -d'=' -f2)
                      NEW_RELEASE=$((CURRENT_RELEASE + 1))
                      sed -i "s/^RELEASE=.*/RELEASE=${NEW_RELEASE}/" datarobot-user-models.conf

                      # github.create-pr.sh commits with -F when given a file, and gh pr create --fill takes the
                      # title from the first line and the body from the rest. No backticks below: this is an
                      # unquoted heredoc, so one would run as a command. Expanded variables are not re-parsed, so
                      # commit text containing $(...) is inert.
                      MSG_FILE=/tmp/pr-message.txt
                      cat > "$MSG_FILE" <<EOF
                      [-] (Auto): datarobot-user-models Execution Environments release bump

                      RELEASE ${CURRENT_RELEASE} -> ${NEW_RELEASE}, after promoting the images below.
                      EOF

                      [ -n "$PROMOTED" ] && printf '\nPromoted: %s\n' "$(echo $PROMOTED)" >> "$MSG_FILE"
                      [ -n "$TICKETS" ] && printf 'Tickets: %s\n' "$(echo $TICKETS)" >> "$MSG_FILE"
                      [ -n "$CVES" ] && printf 'CVEs: %s\n' "$(echo $CVES)" >> "$MSG_FILE"
                      {
                        printf '\nSource: datarobot/datarobot-user-models @ %s, %s\n' "$TARGET_BRANCH" "${COMMIT_SHA:0:12}"
                        [ -n "$COMMIT_SUBJECT" ] && printf '  %s\n' "$COMMIT_SUBJECT"
                        [ -n "$EXECUTION_URL" ] && printf 'Harness: %s\n' "$EXECUTION_URL"
                        printf '\nEE Helm builds the execution-environments chart from this file, so the\n'
                        printf 'chart is not republished until this merges.\n'
                      } >> "$MSG_FILE"

                      # The one step that must never report success without a PR: without it the promoted images
                      # are never pinned and the fix is not deployed.
                      if ! /usr/local/bin/github.create-pr.sh "$MSG_FILE"; then
                        printf 'Bump PR was not created. Leaving the open PRs untouched.\n'
                        exit 1
                      fi

                      # `// empty` matters: without it an empty result is the STRING "null", which passes [ -n ] and
                      # would close every stale PR as "Superseded by #null". Author-filtered so a hand-opened bump is
                      # never mistaken for this run's.
                      NEW_PR="$(gh pr list --repo datarobot/execution-environment-installer --state open \
                        --base "$INSTALLER_BRANCH" --limit 200 --json number,createdAt,title,author \
                        --jq "[.[] | select(.author.login == \"svc-harness-git2\")
                                   | select(.title | contains(\"$BUMP_TITLE\"))] | sort_by(.createdAt) | last | .number // empty" 2>/dev/null || true)"
                      # If the newest match is one already listed as stale, the new PR is not visible yet. Close
                      # nothing rather than crown a stale PR the successor.
                      case " $STALE_PRS " in *" $NEW_PR "*) NEW_PR="" ;; esac

                      # A real bump is exactly this one file, +1/-1. Anything else is not what this step produced,
                      # so leave it for a person instead of closing others in its name.
                      if [ -n "$NEW_PR" ]; then
                        SHAPE="$(gh pr view "$NEW_PR" --repo datarobot/execution-environment-installer \
                          --json files --jq '[.files[] | "\(.path):\(.additions):\(.deletions)"] | join(",")' 2>/dev/null || true)"
                        if [ "$SHAPE" != "manifests/datarobot-user-models.conf:1:1" ]; then
                          printf 'PR #%s is not a plain RELEASE bump (%s); leaving the stale ones open.\n' \
                            "$NEW_PR" "${SHAPE:-could not read its files}"
                          NEW_PR=""
                        fi
                      fi

                      for pr in $STALE_PRS; do
                        if [ -n "$NEW_PR" ] && [ "$pr" != "$NEW_PR" ]; then
                          gh pr close "$pr" --repo datarobot/execution-environment-installer \
                            --comment "Superseded by #${NEW_PR}, which carries the same RELEASE bump." || true
                        fi
                      done
  properties:
    ci:
      codebase:
        connectorRef: account.svc_harness_git1
        repoName: datarobot-user-models
        build: <+input>
        sparseCheckout: []
  description: Pipeline is triggered when PR, that changes environments, is merged to master. For every changed environment. E.g. based on env_info.json,  image "datarobotdev/<image_repo>:<tag>" is promoted to "datarobot/<image_repo>:<tag>"
