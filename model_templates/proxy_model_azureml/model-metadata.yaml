name: proxy-model-azure
type: inference
targetType: regression

runtimeParameterDefinitions:
  - fieldName: endpoint
    type: string
    description: The name of the AzureML endpoint.

  - fieldName: region
    type: string
    defaultValue: eastus
    description: The region name the endpoint resides in.

  - fieldName: API_KEY
    type: credential
    description: An HTTP Basic credential that contains the Endpoint's API key in the password field (the username field is ignored).

  - fieldName: deployment
    type: string
    description: Optional name of specific deployment to use (if left blank we will use default endpoint routing).

  - fieldName: verifySSL
    type: string
    defaultValue: "true"
    description: >-
      Whether to verify the endpoint's certificate trust chain. Defaults to "true" (verify).
      Set to "false" only if the endpoint uses a self-signed or otherwise untrusted
      certificate; this disables verification and exposes the API key to interception.
